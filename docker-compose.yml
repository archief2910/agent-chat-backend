services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_chat
    ports:
      - "5432:5432"
    volumes:
      - agent_chat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_chat_pg:
